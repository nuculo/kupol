[package]
name = "duo-kan"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
arc-swap = "1.8.2"
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
colored = "3"
futures-util = "0.3.32"
glob = "0.3"
petgraph = "0.8.3"
proc-macro2 = "1.0.106"
quote = "1.0.45"
ra_ap_base_db = "0.0.324"
ra_ap_edition = "0.0.324"
ra_ap_hir = "0.0.324"
ra_ap_ide = "0.0.324"
ra_ap_syntax = "0.0.324"
rand = "0.9"
rayon = "1.10"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
syn = { version = "2.0.117", features = ["full", "visit"] }
tabled = "0.18"
tokio = { version = "1.50.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.22.0", features = ["v4"] }
