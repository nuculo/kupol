name: KUPOL scan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download engine release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0 \
            --repo "${{ github.repository }}" \
            --pattern 'duo-agents-v1.0-Release.tar.gz'
          tar -xzf duo-agents-v1.0-Release.tar.gz
          BIN="$(find . -type f -name duo-agents ! -name '*.exe' | head -n 1)"
          if [ -z "$BIN" ]; then
            echo "linux engine binary not found in release tarball" >&2
            exit 1
          fi
          chmod +x "$BIN" bin/kupol
          echo "KUPOL_BIN=$PWD/$BIN" >> "$GITHUB_ENV"
          echo "using engine $BIN"

      - name: "expected red: fixtures contain vulns"
        run: ./bin/kupol scan fixtures/vuln-lab -f markdown -o smoke-report.md --fail-on high

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: smoke-report.md

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download engine release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0 \
            --repo "${{ github.repository }}" \
            --pattern 'duo-agents-v1.0-Release.tar.gz'
          tar -xzf duo-agents-v1.0-Release.tar.gz
          BIN="$(find . -type f -name duo-agents ! -name '*.exe' | head -n 1)"
          if [ -z "$BIN" ]; then
            echo "linux engine binary not found in release tarball" >&2
            exit 1
          fi
          chmod +x "$BIN" bin/kupol
          echo "KUPOL_BIN=$PWD/$BIN" >> "$GITHUB_ENV"
          echo "using engine $BIN"

      - name: Gate (src dashboard bin website, not fixtures)
        run: ./bin/kupol scan src dashboard bin website -f markdown -o gate-report.md --fail-on critical

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: gate-report.md
