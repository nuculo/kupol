name: KUPOL scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download engine release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0 \
            --repo "${{ github.repository }}" \
            --pattern 'duo-agents-v1.0-Release.tar.gz'
          tar -xzf duo-agents-v1.0-Release.tar.gz
          BIN="$(find . -type f -name duo-agents ! -name '*.exe' | head -n 1)"
          if [ -z "$BIN" ]; then
            echo "linux engine binary not found in release tarball" >&2
            exit 1
          fi
          chmod +x "$BIN" bin/kupol
          echo "KUPOL_BIN=$PWD/$BIN" >> "$GITHUB_ENV"
          echo "using engine $BIN"

      - name: Scan
        run: ./bin/kupol scan . -f markdown -o kupol-report.md --fail-on high

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kupol-report
          path: kupol-report.md
