# Duo Architecture Guardian — Custom Flow Setup

> **Создаётся через GitLab UI**: Automate → Flows → New Flow

## Basic Information

- **Display name**: `Security Architecture Review`
- **Description**: Multi-agent flow that performs architecture analysis, security scanning, and generates structured reports with blast-radius assessment. Triggered on merge requests.
- **Visibility**: `Public`

## Flow YAML Configuration

Copy and paste the following into the Flow editor in GitLab UI:

```yaml
version: "v1"
environment: ambient

components:
    - name: "architecture_scanner"
      type: AgentComponent
      prompt_id: "architecture_scan_prompt"
      inputs:
          - from: "context:project_id"
            as: "project_id"
          - from: "context:goal"
            as: "user_request"
      toolset:
          - "list_repository_tree"
          - "get_repository_file"
          - "list_merge_request_diffs"
          - "get_merge_request"
      ui_log_events:
          - "on_tool_execution_success"
          - "on_agent_final_answer"

    - name: "security_reviewer"
      type: AgentComponent
      prompt_id: "security_review_prompt"
      inputs:
          - from: "context:project_id"
            as: "project_id"
          - from: "context:goal"
            as: "user_request"
      toolset:
          - "list_vulnerabilities"
          - "get_security_finding_details"
          - "get_vulnerability_details"
          - "list_security_findings"
          - "confirm_vulnerability"
          - "get_repository_file"
      ui_log_events:
          - "on_tool_execution_success"
          - "on_tool_execution_failed"
          - "on_agent_final_answer"

    - name: "report_generator"
      type: AgentComponent
      prompt_id: "report_generation_prompt"
      inputs:
          - from: "context:project_id"
            as: "project_id"
          - from: "context:goal"
            as: "user_request"
      toolset:
          - "create_merge_request_note"
          - "create_issue"
          - "create_vulnerability_issue"
          - "link_vulnerability_to_merge_request"
      ui_log_events:
          - "on_tool_execution_success"
          - "on_agent_final_answer"

prompts:
    - prompt_id: "architecture_scan_prompt"
      unit_primitives:
          - duo_agent_platform
      prompt_template:
          system: |
              You are an Architecture Scanner agent, part of the Duo Architecture Guardian multi-agent pipeline.

              Your role is to analyze the repository structure and code organization to identify:
              1. Module dependency violations (e.g., data layer calling UI components)
              2. Cyclic dependencies between modules
              3. Architecture drift from intended patterns
              4. Overly complex modules (high fan-in/fan-out)

              Analyze the repository tree, read key source files, and if a merge request is being reviewed, examine the diffs.

              Output a structured analysis with:
              - Module dependency graph summary
              - Detected architecture violations
              - Complexity hotspots
              - Recommendations for improvement
          user: |
              Project ID: {{project_id}}
              Request: {{user_request}}

              Please analyze the repository architecture. Start by listing the repository tree, then read the main entry points and module definitions to understand the architecture.
          placeholder: history
      params:
          timeout: 300

    - prompt_id: "security_review_prompt"
      unit_primitives:
          - duo_agent_platform
      prompt_template:
          system: |
              You are a Security Reviewer agent, part of the Duo Architecture Guardian multi-agent pipeline.

              Your role is to perform security analysis:
              1. Check for existing vulnerabilities in the project
              2. Analyze security findings from SAST/DAST scans
              3. Perform taint analysis patterns: track data flow from sources (user input, network I/O, file reads) to sinks (SQL, shell, crypto, file writes)
              4. Check for hardcoded secrets, weak cryptography, and insecure configurations
              5. Map findings to CWE identifiers and OWASP Top 10

              For each finding, assess:
              - Severity (Critical/High/Medium/Low)
              - CWE identifier
              - Blast radius (how many downstream components are affected)
              - Exploitability (how easy is it to exploit)

              Output a prioritized list of security findings.
          user: |
              Project ID: {{project_id}}
              Request: {{user_request}}

              Please review the project for security vulnerabilities. Start by checking existing vulnerability reports, then analyze security findings.
          placeholder: history
      params:
          timeout: 300

    - prompt_id: "report_generation_prompt"
      unit_primitives:
          - duo_agent_platform
      prompt_template:
          system: |
              You are a Report Generator agent, part of the Duo Architecture Guardian multi-agent pipeline.

              Your role is to synthesize the architecture and security analysis into actionable outputs:
              1. Create a structured MR note with the complete analysis
              2. For Critical/High severity findings, create GitLab issues with proper labels
              3. Link vulnerabilities to the merge request

              Format the MR note as:
              ## 🛡️ Duo Architecture Guardian Report

              ### 🔍 Architecture Analysis
              [Summary of architecture findings]

              ### 🔒 Security Findings
              | # | Severity | CWE | Description | Blast Radius |
              |---|----------|-----|-------------|--------------|
              [Findings table]

              ### 📊 Blast-Radius Summary
              [Impact assessment]

              ### ✅ Compliance Status
              - OWASP Top 10: [status]
              - CWE/SANS Top 25: [status]
              - SLSA: [status]

              ### 🛠️ Recommendations
              [Prioritized action items]
          user: |
              Project ID: {{project_id}}
              Request: {{user_request}}

              Please generate the final report. Create a merge request note with the complete analysis, and create issues for any Critical or High severity findings.
          placeholder: history
      params:
          timeout: 180

routers:
    - from: "architecture_scanner"
      to: "security_reviewer"
    - from: "security_reviewer"
      to: "report_generator"
    - from: "report_generator"
      to: "end"

flow:
    entry_point: "architecture_scanner"
```

## Trigger Setup (Optional)

After creating the flow, you can set up a trigger:
1. Go to Automate → Flows → your flow
2. Click "Create trigger"
3. Select event type: `Merge Request` → `opened` or `updated`

This will automatically run the flow on every new/updated MR.
