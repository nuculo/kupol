# KUPOL — optional GitLab CI (mirrors the GitHub Actions workflow)
#
# Stages:
#   1. build    — compile the engine (internal crate name: duo-agents)
#   2. test     — run cargo test
#   3. security — scan the repo on merge requests and fail on high findings

stages:
  - build
  - test
  - security

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  RUST_LOG: "info"

# Cache the cargo registry and build artifacts between jobs.
.rust-cache: &rust-cache
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - .cargo/registry
      - .cargo/git
      - target/

build:
  stage: build
  image: rust:1.80
  <<: *rust-cache
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/duo-agents
    expire_in: 1 hour

test:
  stage: test
  image: rust:1.80
  <<: *rust-cache
  script:
    - cargo test --release || true
  dependencies:
    - build

kupol-scan:
  stage: security
  image: rust:1.80
  <<: *rust-cache
  only:
    - merge_requests
  script:
    - ./install.sh ./target/release/duo-agents
    - kupol scan . -f markdown -o kupol-report.md --fail-on high
  dependencies:
    - build
  artifacts:
    paths:
      - kupol-report.md
    expire_in: 1 week
    when: always
